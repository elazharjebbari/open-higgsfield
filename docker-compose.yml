# Déploiement VPS (Hostinger Docker Manager ou `docker compose up -d --build`).
# Variables à définir dans l'environnement du projet, jamais dans ce fichier :
#   HF_API_KEY_ID, HF_API_KEY_SECRET, STUDIO_PASSWORD (+ STUDIO_USER optionnel)
services:
  ad-studio:
    build: https://github.com/elazharjebbari/open-higgsfield.git#main
    restart: unless-stopped
    environment:
      HF_API_KEY_ID: ${HF_API_KEY_ID}
      HF_API_KEY_SECRET: ${HF_API_KEY_SECRET}
      STUDIO_USER: ${STUDIO_USER:-studio}
      STUDIO_PASSWORD: ${STUDIO_PASSWORD:?STUDIO_PASSWORD est obligatoire}
    volumes:
      - ad-studio-work:/app/work
      - ad-studio-outputs:/app/outputs
    # Accessible uniquement depuis le VPS : le reverse proxy (HTTPS) pointe vers 127.0.0.1:8787.
    ports:
      - "127.0.0.1:8787:8787"
volumes:
  ad-studio-work:
  ad-studio-outputs:
